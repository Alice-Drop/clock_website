<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clock & Weather</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0d0d0d;
            --card-bg: #1a1a1a;
            --card-bg-hover: #222;
            --text-primary: #f0f0f0;
            --text-secondary: #888;
            --text-muted: #555;
            --accent: #4fc3f7;
            --accent-soft: rgba(79, 195, 247, 0.15);
            --border: #2a2a2a;
            --weather-bg: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --sun: #ffd54f;
            --cloud: #90a4ae;
            --rain: #4fc3f7;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        /* 手机外框 - 高度占满窗口，宽度按 360:720 比例等比缩放 */
        .phone-frame {
            width: calc(100vh * 360 / 720);
            height: 100vh;
            background: #000;
            border-radius: calc(100vh * 40 / 720);
            padding: calc(100vh * 12 / 720);
            /*box-shadow: 0 calc(100vh * 25 / 720) calc(100vh * 80 / 720) rgba(0,0,0,0.6), 0 0 0 1px #333, inset 0 0 calc(100vh * 20 / 720) rgba(255,255,255,0.03);*/
            position: relative;
        }

        .phone-frame::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100vh * 150 / 720);
            height: calc(100vh * 28 / 720);
            background: #111;
            border-radius: 0 0 calc(100vh * 20 / 720) calc(100vh * 20 / 720);
            z-index: 10;
        }

        .phone-frame::after {
            content: '';
            position: absolute;
            bottom: calc(100vh * 8 / 720);
            left: 50%;
            transform: translateX(-50%);
            width: calc(100vh * 120 / 720);
            height: calc(100vh * 4 / 720);
            background: #333;
            border-radius: calc(100vh * 2 / 720);
        }

        /* 屏幕 */
        .screen {
            width: 100%;
            height: 100%;
            background: var(--bg);
            border-radius: calc(100vh * 32 / 720);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* 状态栏 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px 4px;
            font-size: 16px;
            color: var(--text-secondary);
            z-index: 5;
        }

        .status-icons {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .status-icons svg {
            width: 18px;
            height: 18px;
            fill: var(--text-secondary);
        }

        /* 内容区 - 可滚动 */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 20px;
            scrollbar-width: none;
        }

        .content::-webkit-scrollbar {
            display: none;
        }

        /* 时钟区域 */
        .clock-section {
            text-align: center;
            padding: 20px 0 16px;
        }

        .time-display {
            font-size: 72px;
            font-weight: 200;
            color: var(--text-primary);
            line-height: 1;
            letter-spacing: -2px;
            font-variant-numeric: tabular-nums;

            padding-top: 30px;
        }

        .time-display .seconds {
            font-size: 28px;
            font-weight: 300;
            color: var(--text-secondary);
            margin-left: 4px;
        }

        .date-display {
            margin-top: 10px;
            font-size: 16px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .weekday {
            margin-top: 4px;
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* 天气卡片 */
        .weather-card {
            background: var(--weather-bg);
            border-radius: 24px;
            padding: 20px;
            margin: 8px 0 16px;
            position: relative;
            overflow: hidden;
        }

        .weather-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(79,195,247,0.1) 0%, transparent 70%);
            border-radius: 50%;
        }

        .weather-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .weather-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .weather-icon {
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .weather-icon svg {
            width: 48px;
            height: 48px;
        }

        .weather-temp {
            font-size: 42px;
            font-weight: 200;
            color: var(--text-primary);
            line-height: 1;
        }

        .weather-temp span {
            font-size: 20px;
            font-weight: 300;
            color: var(--text-secondary);
        }

        .weather-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .weather-details {
            display: flex;
            gap: 20px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .weather-detail {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .weather-detail svg {
            width: 14px;
            height: 14px;
            fill: var(--text-muted);
        }

        /* 日历区域 */
        .calendar-section {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .calendar-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .calendar-nav {
            display: flex;
            gap: 8px;
        }

        .calendar-nav button {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            border: none;
            background: var(--bg);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .calendar-nav button:hover {
            background: var(--card-bg-hover);
            color: var(--text-primary);
        }

        .calendar-nav button svg {
            width: 16px;
            height: 16px;
        }

        /* 星期标题 */
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 8px;
        }

        .weekday-label {
            text-align: center;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            padding: 8px 0;
        }

        .weekday-label.weekend {
            color: #ef5350;
        }

        /* 日期网格 */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .day-cell:hover {
            background: var(--card-bg-hover);
        }

        .day-cell.other-month {
            color: var(--text-muted);
            opacity: 0.5;
        }

        .day-cell.today {
            background: var(--accent-soft);
            color: var(--accent);
            font-weight: 600;
        }

        .day-cell.today::after {
            content: '';
            position: absolute;
            bottom: 4px;
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
        }

        .day-cell.selected {
            background: var(--accent);
            color: #000;
            font-weight: 600;
        }

        .day-cell.selected::after {
            display: none;
        }

        .day-cell.weekend {
            color: #ef5350;
        }

        .day-cell.weekend.other-month {
            color: #ef5350;
            opacity: 0.3;
        }

        /* 底部信息 */
        .footer-info {
            text-align: center;
            padding: 8px 0;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* 动画 */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .colon {
            animation: pulse 1s ease-in-out infinite;
        }

        /* 城市选择 */
        .city-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            margin-bottom: 8px;
        }

        .city-selector svg {
            width: 14px;
            height: 14px;
            fill: var(--text-secondary);
        }

        /* 响应式：小屏设备使用动态视口高度，避免地址栏影响 */
        @supports (height: 100dvh) {
            .phone-frame {
                height: 100dvh;
                width: calc(100dvh * 360 / 720);
                border-radius: calc(100dvh * 40 / 720);
                padding: calc(100dvh * 12 / 720);
                /*box-shadow: 0 calc(100dvh * 25 / 720) calc(100dvh * 80 / 720) rgba(0,0,0,0.6), 0 0 0 1px #333, inset 0 0 calc(100dvh * 20 / 720) rgba(255,255,255,0.03);*/
            }
            .phone-frame::before {
                width: calc(100dvh * 150 / 720);
                height: calc(100dvh * 28 / 720);
                border-radius: 0 0 calc(100dvh * 20 / 720) calc(100dvh * 20 / 720);
            }
            .phone-frame::after {
                bottom: calc(100dvh * 8 / 720);
                width: calc(100dvh * 120 / 720);
                height: calc(100dvh * 4 / 720);
                border-radius: calc(100dvh * 2 / 720);
            }
            .screen {
                border-radius: calc(100dvh * 32 / 720);
            }
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="screen">
            <!-- 状态栏 -->
            <div class="status-bar">
                <span id="status-time">12:00</span>
                <div class="status-icons">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    <svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
                    <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
                </div>
            </div>

            <!-- 内容区 -->
            <div class="content">
                <!-- 时钟 -->
                <div class="clock-section">
                    <div class="time-display">
                        <span id="hours">12</span><span class="colon">:</span><span id="minutes">00</span><span class="seconds" id="seconds">00</span>
                    </div>
                    <div class="date-display" id="full-date">2024年1月1日</div>
                    <div class="weekday" id="weekday">星期一</div>
                </div>

                <!-- 天气 -->
                <div class="weather-card">
                    <div class="city-selector" onclick="changeCity()">
                        <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                        <span id="city-name">北京</span>
                    </div>
                    <div class="weather-main">
                        <div class="weather-left">
                            <div class="weather-icon" id="weather-icon">
                                <!-- 晴天 -->
                                <svg viewBox="0 0 64 64">
                                    <circle cx="32" cy="32" r="14" fill="#ffd54f"/>
                                    <g stroke="#ffd54f" stroke-width="3" stroke-linecap="round">
                                        <line x1="32" y1="6" x2="32" y2="12"/>
                                        <line x1="32" y1="52" x2="32" y2="58"/>
                                        <line x1="6" y1="32" x2="12" y2="32"/>
                                        <line x1="52" y1="32" x2="58" y2="32"/>
                                        <line x1="13.6" y1="13.6" x2="17.8" y2="17.8"/>
                                        <line x1="46.2" y1="46.2" x2="50.4" y2="50.4"/>
                                        <line x1="13.6" y1="50.4" x2="17.8" y2="46.2"/>
                                        <line x1="46.2" y1="17.8" x2="50.4" y2="13.6"/>
                                    </g>
                                </svg>
                            </div>
                            <div>
                                <div class="weather-temp"><span id="temperature">24</span><span>°C</span></div>
                            </div>
                        </div>
                    </div>
                    <div class="weather-desc" id="weather-desc">晴朗 · 空气质量优</div>
                    <div class="weather-details">
                        <div class="weather-detail">
                            <svg viewBox="0 0 24 24"><path d="M12 2c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2z"/></svg>
                            <span id="humidity">45%</span>
                        </div>
                        <div class="weather-detail">
                            <svg viewBox="0 0 24 24"><path d="M12.01 5.5L10 8h4l-1.99-2.5zM18 10v4l2.5-1.99L18 10zM6 10l-2.5 2.01L6 14v-4zm8 6h-4l2.01 2.5L14 16zm7-13H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14z"/></svg>
                            <span id="wind">东北风 3级</span>
                        </div>
                        <div class="weather-detail">
                            <svg viewBox="0 0 24 24"><path d="M6 2v6h.01L6 8.01 10 12l-4 4 .01.01H6V22h12v-5.99h-.01L18 16l-4-4 4-3.99-.01-.01H18V2H6z"/></svg>
                            <span id="pressure">1013hPa</span>
                        </div>
                    </div>
                </div>

                <!-- 日历 -->
                <div class="calendar-section">
                    <div class="calendar-header">
                        <div class="calendar-title" id="calendar-month">2024年1月</div>
                        <div class="calendar-nav">
                            <button onclick="prevMonth()">
                                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                            </button>
                            <button onclick="nextMonth()">
                                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="weekdays">
                        <div class="weekday-label weekend">日</div>
                        <div class="weekday-label">一</div>
                        <div class="weekday-label">二</div>
                        <div class="weekday-label">三</div>
                        <div class="weekday-label">四</div>
                        <div class="weekday-label">五</div>
                        <div class="weekday-label weekend">六</div>
                    </div>
                    <div class="days-grid" id="days-grid"></div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // ========== 时钟 ==========
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('hours').textContent = hours;
            document.getElementById('minutes').textContent = minutes;
            document.getElementById('seconds').textContent = seconds;

            // 状态栏时间
            document.getElementById('status-time').textContent = `${hours}:${minutes}`;

            // 日期
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            document.getElementById('full-date').textContent = `${year}年${month}月${day}日`;

            // 星期
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            document.getElementById('weekday').textContent = weekdays[now.getDay()];
        }

        setInterval(updateClock, 1000);
        updateClock();

        // ========== 天气 ==========
        // 天气图标 SVG 模板
        const weatherIcons = {
            sunny: `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="14" fill="#ffd54f"/><g stroke="#ffd54f" stroke-width="3" stroke-linecap="round"><line x1="32" y1="6" x2="32" y2="12"/><line x1="32" y1="52" x2="32" y2="58"/><line x1="6" y1="32" x2="12" y2="32"/><line x1="52" y1="32" x2="58" y2="32"/><line x1="13.6" y1="13.6" x2="17.8" y2="17.8"/><line x1="46.2" y1="46.2" x2="50.4" y2="50.4"/><line x1="13.6" y1="50.4" x2="17.8" y2="46.2"/><line x1="46.2" y1="17.8" x2="50.4" y2="13.6"/></g></svg>`,
            cloudy: `<svg viewBox="0 0 64 64"><circle cx="24" cy="24" r="10" fill="#ffd54f" opacity="0.8"/><path d="M46 44H22c-4.4 0-8-3.6-8-8s3.6-8 8-8c0.5 0 1 0.1 1.5 0.2C24.5 23.6 28.8 20 34 20c5.8 0 10.6 4.4 11.8 10.1C48.3 30.8 51 33.6 51 37c0 3.9-3.1 7-7 7z" fill="#90a4ae"/></svg>`,
            rain: `<svg viewBox="0 0 64 64"><path d="M46 36H22c-4.4 0-8-3.6-8-8s3.6-8 8-8c0.5 0 1 0.1 1.5 0.2C24.5 15.6 28.8 12 34 12c5.8 0 10.6 4.4 11.8 10.1C48.3 22.8 51 25.6 51 29c0 3.9-3.1 7-7 7z" fill="#90a4ae"/><g stroke="#4fc3f7" stroke-width="2" stroke-linecap="round"><line x1="24" y1="42" x2="22" y2="50"/><line x1="34" y1="42" x2="32" y2="50"/><line x1="44" y1="42" x2="42" y2="50"/></g></svg>`
        };

        // 天气代码 → 描述/图标类型映射
        const weatherCodeMap = {
            0:  { desc: '晴朗', type: 'sunny' },
            1:  { desc: '大部晴朗', type: 'sunny' },
            2:  { desc: '多云', type: 'cloudy' },
            3:  { desc: '阴天', type: 'cloudy' },
            45: { desc: '雾', type: 'cloudy' },
            48: { desc: '雾凇', type: 'cloudy' },
            51: { desc: '毛毛雨', type: 'rain' },
            53: { desc: '小雨', type: 'rain' },
            55: { desc: '中雨', type: 'rain' },
            56: { desc: '冻毛毛雨', type: 'rain' },
            57: { desc: '冻雨', type: 'rain' },
            61: { desc: '小雨', type: 'rain' },
            63: { desc: '中雨', type: 'rain' },
            65: { desc: '大雨', type: 'rain' },
            66: { desc: '冻雨', type: 'rain' },
            67: { desc: '冻雨', type: 'rain' },
            71: { desc: '小雪', type: 'cloudy' },
            73: { desc: '中雪', type: 'cloudy' },
            75: { desc: '大雪', type: 'cloudy' },
            77: { desc: '雪粒', type: 'cloudy' },
            80: { desc: '阵雨', type: 'rain' },
            81: { desc: '中阵雨', type: 'rain' },
            82: { desc: '大阵雨', type: 'rain' },
            85: { desc: '小雪阵', type: 'cloudy' },
            86: { desc: '大雪阵', type: 'cloudy' },
            95: { desc: '雷暴', type: 'rain' },
            96: { desc: '雷暴+冰雹', type: 'rain' },
            99: { desc: '强雷暴+冰雹', type: 'rain' },
        };

        function getWeatherInfo(code) {
            return weatherCodeMap[code] || { desc: '多云', type: 'cloudy' };
        }

        // 风向角度 → 中文描述
        function windDirectionText(deg) {
            const dirs = ['北', '东北', '东', '东南', '南', '西南', '西', '西北'];
            return dirs[Math.round(deg / 45) % 8] + '风';
        }

        // 更新天气 UI
        function updateWeatherUI(city, temp, desc, humidity, wind, pressure, iconType) {
            document.getElementById('city-name').textContent = city;
            document.getElementById('temperature').textContent = temp;
            document.getElementById('weather-desc').textContent = desc;
            document.getElementById('humidity').textContent = humidity;
            document.getElementById('wind').textContent = wind;
            document.getElementById('pressure').textContent = pressure;
            document.getElementById('weather-icon').innerHTML = weatherIcons[iconType] || weatherIcons.cloudy;
        }

        // ========== 自动定位 + 获取真实天气 ==========
        let lastLat = null;
        let lastLon = null;
        let lastCity = '北京';
        let weatherFetching = false;

        // 通过浏览器 GPS 获取精确位置（会弹出权限请求）
        function getBrowserLocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error('浏览器不支持定位'));
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        resolve({
                            lat: pos.coords.latitude,
                            lon: pos.coords.longitude,
                            source: 'gps'
                        });
                    },
                    (err) => {
                        reject(new Error(`定位权限被拒绝或超时：${err.message}`));
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 300000 }
                );
            });
        }

        // 通过 IP 获取粗略位置（降级方案）
        async function getIPLocation() {
            const locRes = await fetch('https://ipapi.co/json/');
            if (!locRes.ok) throw new Error('IP 定位失败');
            const data = await locRes.json();
            return {
                lat: data.latitude || 39.9042,
                lon: data.longitude || 116.4074,
                city: data.city || '北京',
                source: 'ip'
            };
        }

        // 根据经纬度反查城市名
        async function reverseGeocode(lat, lon) {
            try {
                const res = await fetch(
                    `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=zh`,
                    { headers: { 'User-Agent': 'ClockWeatherApp/1.0' } }
                );
                if (!res.ok) throw new Error('逆地理编码失败');
                const data = await res.json();
                // 优先取 city，其次 town、village、county
                return data.address.city || data.address.town || data.address.village || 
                       data.address.county || data.address.state || '未知';
            } catch {
                return null;
            }
        }

        async function fetchLocationAndWeather() {
            if (weatherFetching) return;
            weatherFetching = true;

            let lat, lon, city, source;

            try {
                // 步骤1：优先使用浏览器 GPS 定位（会弹出权限请求）
                try {
                    const geo = await getBrowserLocation();
                    lat = geo.lat;
                    lon = geo.lon;
                    source = 'gps';
                    // GPS 定位成功，反查城市名
                    const geoCity = await reverseGeocode(lat, lon);
                    city = geoCity || lastCity;
                } catch (geoErr) {
                    console.warn('[天气] GPS 定位失败，降级为 IP 定位：', geoErr.message);
                    // 降级：IP 定位
                    const ip = await getIPLocation();
                    lat = ip.lat;
                    lon = ip.lon;
                    city = ip.city;
                    source = 'ip';
                }

                // 步骤2：获取天气
                const weatherRes = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
                    `&current=temperature_2m,relative_humidity_2m,weather_code,surface_pressure,wind_speed_10m,wind_direction_10m` +
                    `&timezone=auto`
                );
                if (!weatherRes.ok) throw new Error('天气 API 失败');
                const weatherData = await weatherRes.json();
                const cur = weatherData.current;

                // 更新缓存
                lastLat = lat;
                lastLon = lon;
                lastCity = city;

                const info = getWeatherInfo(cur.weather_code);
                const windDir = windDirectionText(cur.wind_direction_10m || 0);

                updateWeatherUI(
                    city,
                    Math.round(cur.temperature_2m),
                    `${info.desc} · 湿度${cur.relative_humidity_2m}%`,
                    `${cur.relative_humidity_2m}%`,
                    `${windDir} ${cur.wind_speed_10m}km/h`,
                    `${Math.round(cur.surface_pressure)}hPa`,
                    info.type
                );

                console.log(`[天气] 已更新（${source}）：${city} ${Math.round(cur.temperature_2m)}°C ${info.desc}（${new Date().toLocaleTimeString()}）`);
            } catch (e) {
                console.warn('[天气] 获取失败，将稍后重试：', e.message);
            } finally {
                weatherFetching = false;
            }
        }

        // 手动刷新天气（点击城市名触发）
        function changeCity() {
            fetchLocationAndWeather();
        }

        // 首次加载时获取天气
        fetchLocationAndWeather();

        // 每 5 分钟自动更新天气
        const WEATHER_INTERVAL_MS = 5 * 60 * 1000;
        setInterval(fetchLocationAndWeather, WEATHER_INTERVAL_MS);

        // ========== 日历 ==========
        let currentDate = new Date();
        let displayDate = new Date();
        let selectedDate = null;

        function renderCalendar() {
            const year = displayDate.getFullYear();
            const month = displayDate.getMonth();

            document.getElementById('calendar-month').textContent = `${year}年${month + 1}月`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            const grid = document.getElementById('days-grid');
            grid.innerHTML = '';

            const today = new Date();
            const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;

            // 上月日期
            for (let i = firstDay - 1; i >= 0; i--) {
                const day = daysInPrevMonth - i;
                const cell = createDayCell(day, true, false, false);
                grid.appendChild(cell);
            }

            // 当月日期
            for (let day = 1; day <= daysInMonth; day++) {
                const isToday = isCurrentMonth && day === today.getDate();
                const isSelected = selectedDate && selectedDate.getDate() === day && 
                    selectedDate.getMonth() === month && selectedDate.getFullYear() === year;
                const cell = createDayCell(day, false, isToday, isSelected);
                grid.appendChild(cell);
            }

            // 下月日期
            const remainingCells = 42 - (firstDay + daysInMonth);
            for (let day = 1; day <= remainingCells; day++) {
                const cell = createDayCell(day, true, false, false);
                grid.appendChild(cell);
            }
        }

        function createDayCell(day, isOtherMonth, isToday, isSelected) {
            const cell = document.createElement('div');
            cell.className = 'day-cell';
            cell.textContent = day;

            if (isOtherMonth) cell.classList.add('other-month');
            if (isToday) cell.classList.add('today');
            if (isSelected) cell.classList.add('selected');

            // 计算是否为周末
            const tempDate = new Date(displayDate.getFullYear(), displayDate.getMonth(), day);
            const dayOfWeek = tempDate.getDay();
            if ((dayOfWeek === 0 || dayOfWeek === 6) && !isOtherMonth) {
                cell.classList.add('weekend');
            }

            cell.onclick = () => {
                document.querySelectorAll('.day-cell.selected').forEach(c => c.classList.remove('selected'));
                if (!isOtherMonth) {
                    cell.classList.add('selected');
                    selectedDate = new Date(displayDate.getFullYear(), displayDate.getMonth(), day);
                }
            };

            return cell;
        }

        function prevMonth() {
            displayDate.setMonth(displayDate.getMonth() - 1);
            renderCalendar();
        }

        function nextMonth() {
            displayDate.setMonth(displayDate.getMonth() + 1);
            renderCalendar();
        }

        renderCalendar();
    </script>
</body>
