<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clock & Weather</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0d0d0d;
            --card-bg: #1a1a1a;
            --card-bg-hover: #222;
            --text-primary: #f0f0f0;
            --text-secondary: #888;
            --text-muted: #555;
            --accent: #4fc3f7;
            --accent-soft: rgba(79, 195, 247, 0.15);
            --border: #2a2a2a;
            --weather-bg: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --sun: #ffd54f;
            --cloud: #90a4ae;
            --rain: #4fc3f7;
            --spacing-xs: clamp(4px, 0.8vh, 6px);
            --spacing-sm: clamp(8px, 1.5vh, 12px);
            --spacing-md: clamp(12px, 2.5vh, 20px);
            --spacing-lg: clamp(20px, 4vh, 32px);
            --spacing-xl: clamp(28px, 6vh, 48px);
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* ===== 状态栏 ===== */
        .status-bar {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: clamp(10px, 1.8vh, 16px) max(32px, 6vw) clamp(4px, 1vh, 10px);
            font-size: clamp(12px, 1.7vh, 13px);
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .status-icons {
            display: flex;
            gap: 7px;
            align-items: center;
        }

        .status-icons svg {
            width: clamp(13px, 2vh, 15px);
            height: clamp(13px, 2vh, 15px);
            fill: var(--text-secondary);
            color: var(--text-secondary);
        }

        /* ===== 主容器 ===== */
        .main-container {
            flex: 1;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: clamp(10px, 2vh, 20px);
            padding: 0 max(32px, 6vw) clamp(20px, 3vh, 32px);
            min-height: 0;
        }

        /* ===== 时钟区域 ===== */
        .clock-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex: 0 0 auto;
            padding: clamp(4px, 1vh, 12px) 0;
        }

        .time-display {
            font-size: clamp(32px, 6vh, 64px);
            font-weight: 200;
            color: var(--text-primary);
            line-height: 1;
            letter-spacing: -2px;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .time-display .seconds {
            font-size: clamp(12px, 2vh, 24px);
            font-weight: 300;
            color: var(--text-secondary);
            margin-left: 4px;
            vertical-align: super;
        }

        .date-display {
            margin-top: clamp(4px, 0.8vh, 10px);
            font-size: clamp(11px, 1.5vh, 15px);
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .weekday {
            margin-top: clamp(1px, 0.3vh, 3px);
            font-size: clamp(10px, 1.3vh, 13px);
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* ===== 右侧面板 ===== */
        .right-panel {
            display: flex;
            flex-direction: column;
            gap: clamp(10px, 2vh, 20px);
            flex: 1 1 0;
            min-height: 0;
            overflow: hidden;
        }

        /* ===== 天气卡片 ===== */
        .weather-card {
            background: var(--weather-bg);
            border-radius: var(--radius-lg);
            padding: clamp(14px, 2.5vh, 22px) clamp(16px, 3vw, 24px);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .weather-card::before {
            content: '';
            position: absolute;
            top: -40%;
            right: -20%;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(79,195,247,0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .weather-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .weather-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .weather-icon {
            width: clamp(38px, 6vh, 52px);
            height: clamp(38px, 6vh, 52px);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .weather-icon svg {
            width: 100%;
            height: 100%;
        }

        .weather-temp {
            font-size: clamp(28px, 5vh, 40px);
            font-weight: 200;
            color: var(--text-primary);
            line-height: 1;
        }

        .weather-temp span {
            font-size: clamp(13px, 2.2vh, 18px);
            font-weight: 300;
            color: var(--text-secondary);
        }

        .weather-desc {
            font-size: clamp(11px, 1.7vh, 13px);
            color: var(--text-secondary);
            margin-top: clamp(4px, 1vh, 8px);
            position: relative;
        }

        .weather-details {
            display: flex;
            gap: 18px;
            margin-top: clamp(8px, 1.8vh, 14px);
            padding-top: clamp(8px, 1.8vh, 14px);
            border-top: 1px solid rgba(255,255,255,0.06);
            position: relative;
        }

        .weather-detail {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: clamp(10px, 1.5vh, 12px);
            color: var(--text-muted);
        }

        .weather-detail svg {
            width: 13px;
            height: 13px;
            fill: var(--text-muted);
            flex-shrink: 0;
        }

        /* ===== 日历 ===== */
        .calendar-section {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: clamp(14px, 2.2vh, 20px) clamp(14px, 2.8vw, 22px);
            display: flex;
            flex-direction: column;
            flex: 1 1 0;
            min-height: 0;
            overflow: hidden;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: clamp(6px, 1.2vh, 12px);
            flex-shrink: 0;
        }

        .calendar-title {
            font-size: clamp(13px, 2vh, 16px);
            font-weight: 600;
            color: var(--text-primary);
        }

        .calendar-nav {
            display: flex;
            gap: 4px;
        }

        .calendar-nav button {
            width: clamp(26px, 4vh, 30px);
            height: clamp(26px, 4vh, 30px);
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .calendar-nav button:hover {
            background: rgba(255,255,255,0.06);
            color: var(--text-primary);
        }

        .calendar-nav button svg {
            width: clamp(13px, 2vh, 16px);
            height: clamp(13px, 2vh, 16px);
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            margin-bottom: 2px;
            flex-shrink: 0;
        }

        .weekday-label {
            text-align: center;
            font-size: clamp(10px, 1.4vh, 11px);
            font-weight: 500;
            color: var(--text-muted);
            padding: clamp(2px, 0.8vh, 6px) 0;
        }

        .weekday-label.weekend {
            color: #ef5350;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: 1fr;
            gap: 2px;
            flex: 1;
            min-height: 0;
        }

        .day-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: clamp(10px, 1.6vh, 13px);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
            min-height: 0;
            min-width: 0;
        }

        .day-cell:hover {
            background: var(--card-bg-hover);
        }

        .day-cell.other-month {
            color: var(--text-muted);
            opacity: 0.4;
        }

        .day-cell.today {
            background: var(--accent-soft);
            color: var(--accent);
            font-weight: 600;
        }

        .day-cell.today::after {
            content: '';
            position: absolute;
            bottom: 4px;
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
        }

        .day-cell.selected {
            background: var(--accent);
            color: #000;
            font-weight: 600;
        }

        .day-cell.selected::after {
            display: none;
        }

        .day-cell.weekend {
            color: #ef5350;
        }

        .day-cell.weekend.other-month {
            color: #ef5350;
            opacity: 0.3;
        }

        /* ===== 城市选择 ===== */
        .city-selector {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: clamp(11px, 1.7vh, 13px);
            color: var(--text-secondary);
            cursor: pointer;
            margin-bottom: clamp(4px, 1vh, 8px);
            position: relative;
        }

        .city-selector svg {
            width: clamp(12px, 1.8vh, 14px);
            height: clamp(12px, 1.8vh, 14px);
            fill: var(--text-secondary);
        }

        /* ===== 动画 ===== */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .colon {
            animation: pulse 1s ease-in-out infinite;
        }

        /* ================================================================
           横屏布局 (orientation: landscape)
           状态栏 + 主容器放宽 max-width，左右分栏
           ================================================================ */
        @media (orientation: landscape) {
            .status-bar {
                max-width: 900px;
                padding: clamp(10px, 2vh, 16px) max(40px, 6vw) clamp(4px, 1vh, 10px);
            }

            .main-container {
                max-width: 900px;
                flex-direction: row;
                align-items: stretch;
                gap: clamp(20px, 3vw, 36px);
                padding: 0 max(40px, 6vw) clamp(20px, 3vh, 32px);
            }

            .clock-section {
                flex: 0 0 auto;
                min-width: 0;
                padding: 0;
            }

            .right-panel {
                flex: 1 1 0;
                min-width: clamp(260px, 30vw, 380px);
                overflow: hidden;
            }

            .time-display {
                font-size: clamp(36px, 7vh, 72px);
            }
        }

        /* ================================================================
           宽屏 (>= 1200px) —— 给更多呼吸空间
           ================================================================ */
        @media (orientation: landscape) and (min-width: 1200px) {
            .status-bar {
                max-width: 1040px;
                padding: clamp(12px, 2.2vh, 20px) max(56px, 7vw) clamp(6px, 1.2vh, 12px);
            }

            .main-container {
                max-width: 1040px;
                gap: clamp(24px, 3.5vw, 48px);
                padding: 0 max(56px, 7vw) clamp(28px, 4vh, 40px);
            }
        }

        /* ================================================================
           窄竖屏 (< 380px) —— 收窄 padding
           ================================================================ */
        @media (orientation: portrait) and (max-width: 380px) {
            .status-bar {
                padding: clamp(8px, 1.5vh, 12px) max(18px, 5vw) clamp(2px, 0.5vh, 6px);
            }

            .main-container {
                padding: 0 max(18px, 5vw) clamp(16px, 2.5vh, 24px);
                gap: clamp(8px, 1.5vh, 14px);
            }

            .weather-card {
                padding: clamp(12px, 2vh, 16px) clamp(14px, 4vw, 18px);
            }

            .calendar-section {
                padding: clamp(12px, 2vh, 16px) clamp(14px, 4vw, 18px);
            }
        }
    </style>
</head>
<body>
    <!-- 状态栏 -->
    <div class="status-bar">
        <span id="status-time">12:00</span>
        <div class="status-icons">
            <!-- 蜂窝信号 -->
            <svg viewBox="0 0 24 24">
                <rect x="2" y="14" width="4" height="6" rx="1" fill="currentColor"/>
                <rect x="8" y="10" width="4" height="10" rx="1" fill="currentColor"/>
                <rect x="14" y="6" width="4" height="14" rx="1" fill="currentColor"/>
                <rect x="20" y="2" width="4" height="18" rx="1" fill="currentColor"/>
            </svg>
            <!-- WiFi -->
            <svg viewBox="0 0 24 24">
                <path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/>
            </svg>
            <!-- 电池 -->
            <svg viewBox="0 0 24 24">
                <rect x="3" y="6" width="17" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
                <rect x="5" y="8" width="13" height="8" rx="1" fill="currentColor"/>
                <rect x="20" y="9.5" width="2" height="5" rx="1" fill="currentColor"/>
            </svg>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 时钟 -->
        <div class="clock-section">
            <div class="time-display">
                <span id="hours">12</span><span class="colon">:</span><span id="minutes">00</span><span class="seconds" id="seconds">00</span>
            </div>
            <div class="date-display" id="full-date">2024年1月1日</div>
            <div class="weekday" id="weekday">星期一</div>
        </div>

        <!-- 右侧面板：天气 + 日历 -->
        <div class="right-panel">
            <!-- 天气 -->
            <div class="weather-card">
                <div class="city-selector" onclick="changeCity()">
                    <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                    <span id="city-name">北京</span>
                </div>
                <div class="weather-main">
                    <div class="weather-left">
                        <div class="weather-icon" id="weather-icon">
                            <svg viewBox="0 0 64 64">
                                <circle cx="32" cy="32" r="14" fill="#ffd54f"/>
                                <g stroke="#ffd54f" stroke-width="3" stroke-linecap="round">
                                    <line x1="32" y1="6" x2="32" y2="12"/>
                                    <line x1="32" y1="52" x2="32" y2="58"/>
                                    <line x1="6" y1="32" x2="12" y2="32"/>
                                    <line x1="52" y1="32" x2="58" y2="32"/>
                                    <line x1="13.6" y1="13.6" x2="17.8" y2="17.8"/>
                                    <line x1="46.2" y1="46.2" x2="50.4" y2="50.4"/>
                                    <line x1="13.6" y1="50.4" x2="17.8" y2="46.2"/>
                                    <line x1="46.2" y1="17.8" x2="50.4" y2="13.6"/>
                                </g>
                            </svg>
                        </div>
                        <div>
                            <div class="weather-temp"><span id="temperature">24</span><span>°C</span></div>
                        </div>
                    </div>
                </div>
                <div class="weather-desc" id="weather-desc">晴朗 · 空气质量优</div>
                <div class="weather-details">
                    <div class="weather-detail">
                        <svg viewBox="0 0 24 24"><path d="M12 2c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2z"/></svg>
                        <span id="humidity">45%</span>
                    </div>
                    <div class="weather-detail">
                        <svg viewBox="0 0 24 24"><path d="M12.01 5.5L10 8h4l-1.99-2.5zM18 10v4l2.5-1.99L18 10zM6 10l-2.5 2.01L6 14v-4zm8 6h-4l2.01 2.5L14 16zm7-13H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14z"/></svg>
                        <span id="wind">东北风 3级</span>
                    </div>
                    <div class="weather-detail">
                        <svg viewBox="0 0 24 24"><path d="M6 2v6h.01L6 8.01 10 12l-4 4 .01.01H6V22h12v-5.99h-.01L18 16l-4-4 4-3.99-.01-.01H18V2H6z"/></svg>
                        <span id="pressure">1013hPa</span>
                    </div>
                </div>
            </div>

            <!-- 日历 -->
            <div class="calendar-section">
                <div class="calendar-header">
                    <div class="calendar-title" id="calendar-month">2024年1月</div>
                    <div class="calendar-nav">
                        <button onclick="prevMonth()">
                            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                        </button>
                        <button onclick="nextMonth()">
                            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                        </button>
                    </div>
                </div>
                <div class="weekdays">
                    <div class="weekday-label weekend">日</div>
                    <div class="weekday-label">一</div>
                    <div class="weekday-label">二</div>
                    <div class="weekday-label">三</div>
                    <div class="weekday-label">四</div>
                    <div class="weekday-label">五</div>
                    <div class="weekday-label weekend">六</div>
                </div>
                <div class="days-grid" id="days-grid"></div>
            </div>
        </div>
    </div>

    <script>
        // ========== 时钟 ==========
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('hours').textContent = hours;
            document.getElementById('minutes').textContent = minutes;
            document.getElementById('seconds').textContent = seconds;

            // 状态栏时间
            document.getElementById('status-time').textContent = `${hours}:${minutes}`;

            // 日期
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            document.getElementById('full-date').textContent = `${year}年${month}月${day}日`;

            // 星期
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            document.getElementById('weekday').textContent = weekdays[now.getDay()];
        }

        setInterval(updateClock, 1000);
        updateClock();

        // ========== 天气数据（模拟） ==========
        const weatherData = {
            '北京': { temp: 24, desc: '晴朗 · 空气质量优', humidity: '45%', wind: '东北风 3级', pressure: '1013hPa', type: 'sunny' },
            '上海': { temp: 26, desc: '多云 · 空气质量良', humidity: '65%', wind: '东南风 2级', pressure: '1010hPa', type: 'cloudy' },
            '广州': { temp: 30, desc: '小雨 · 空气质量优', humidity: '80%', wind: '南风 3级', pressure: '1008hPa', type: 'rain' },
            '深圳': { temp: 29, desc: '雷阵雨 · 空气质量良', humidity: '78%', wind: '南风 4级', pressure: '1007hPa', type: 'rain' },
            '杭州': { temp: 25, desc: '阴天 · 空气质量良', humidity: '60%', wind: '东风 2级', pressure: '1012hPa', type: 'cloudy' },
            '成都': { temp: 22, desc: '多云 · 空气质量优', humidity: '55%', wind: '北风 1级', pressure: '1015hPa', type: 'cloudy' },
        };

        const cities = Object.keys(weatherData);
        let currentCityIndex = 0;

        const weatherIcons = {
            sunny: `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="14" fill="#ffd54f"/><g stroke="#ffd54f" stroke-width="3" stroke-linecap="round"><line x1="32" y1="6" x2="32" y2="12"/><line x1="32" y1="52" x2="32" y2="58"/><line x1="6" y1="32" x2="12" y2="32"/><line x1="52" y1="32" x2="58" y2="32"/><line x1="13.6" y1="13.6" x2="17.8" y2="17.8"/><line x1="46.2" y1="46.2" x2="50.4" y2="50.4"/><line x1="13.6" y1="50.4" x2="17.8" y2="46.2"/><line x1="46.2" y1="17.8" x2="50.4" y2="13.6"/></g></svg>`,
            cloudy: `<svg viewBox="0 0 64 64"><circle cx="24" cy="24" r="10" fill="#ffd54f" opacity="0.8"/><path d="M46 44H22c-4.4 0-8-3.6-8-8s3.6-8 8-8c0.5 0 1 0.1 1.5 0.2C24.5 23.6 28.8 20 34 20c5.8 0 10.6 4.4 11.8 10.1C48.3 30.8 51 33.6 51 37c0 3.9-3.1 7-7 7z" fill="#90a4ae"/></svg>`,
            rain: `<svg viewBox="0 0 64 64"><path d="M46 36H22c-4.4 0-8-3.6-8-8s3.6-8 8-8c0.5 0 1 0.1 1.5 0.2C24.5 15.6 28.8 12 34 12c5.8 0 10.6 4.4 11.8 10.1C48.3 22.8 51 25.6 51 29c0 3.9-3.1 7-7 7z" fill="#90a4ae"/><g stroke="#4fc3f7" stroke-width="2" stroke-linecap="round"><line x1="24" y1="42" x2="22" y2="50"/><line x1="34" y1="42" x2="32" y2="50"/><line x1="44" y1="42" x2="42" y2="50"/></g></svg>`
        };

        function updateWeather() {
            const city = cities[currentCityIndex];
            const data = weatherData[city];

            document.getElementById('city-name').textContent = city;
            document.getElementById('temperature').textContent = data.temp;
            document.getElementById('weather-desc').textContent = data.desc;
            document.getElementById('humidity').textContent = data.humidity;
            document.getElementById('wind').textContent = data.wind;
            document.getElementById('pressure').textContent = data.pressure;
            document.getElementById('weather-icon').innerHTML = weatherIcons[data.type];
        }

        function changeCity() {
            currentCityIndex = (currentCityIndex + 1) % cities.length;
            updateWeather();
        }

        updateWeather();

        // ========== 日历 ==========
        let currentDate = new Date();
        let displayDate = new Date();
        let selectedDate = null;

        function renderCalendar() {
            const year = displayDate.getFullYear();
            const month = displayDate.getMonth();

            document.getElementById('calendar-month').textContent = `${year}年${month + 1}月`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            const grid = document.getElementById('days-grid');
            grid.innerHTML = '';

            const today = new Date();
            const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;

            // 上月日期
            for (let i = firstDay - 1; i >= 0; i--) {
                const day = daysInPrevMonth - i;
                const cell = createDayCell(day, true, false, false);
                grid.appendChild(cell);
            }

            // 当月日期
            for (let day = 1; day <= daysInMonth; day++) {
                const isToday = isCurrentMonth && day === today.getDate();
                const isSelected = selectedDate && selectedDate.getDate() === day && 
                    selectedDate.getMonth() === month && selectedDate.getFullYear() === year;
                const cell = createDayCell(day, false, isToday, isSelected);
                grid.appendChild(cell);
            }

            // 下月日期
            const remainingCells = 42 - (firstDay + daysInMonth);
            for (let day = 1; day <= remainingCells; day++) {
                const cell = createDayCell(day, true, false, false);
                grid.appendChild(cell);
            }
        }

        function createDayCell(day, isOtherMonth, isToday, isSelected) {
            const cell = document.createElement('div');
            cell.className = 'day-cell';
            cell.textContent = day;

            if (isOtherMonth) cell.classList.add('other-month');
            if (isToday) cell.classList.add('today');
            if (isSelected) cell.classList.add('selected');

            // 计算是否为周末
            const tempDate = new Date(displayDate.getFullYear(), displayDate.getMonth(), day);
            const dayOfWeek = tempDate.getDay();
            if ((dayOfWeek === 0 || dayOfWeek === 6) && !isOtherMonth) {
                cell.classList.add('weekend');
            }

            cell.onclick = () => {
                document.querySelectorAll('.day-cell.selected').forEach(c => c.classList.remove('selected'));
                if (!isOtherMonth) {
                    cell.classList.add('selected');
                    selectedDate = new Date(displayDate.getFullYear(), displayDate.getMonth(), day);
                }
            };

            return cell;
        }

        function prevMonth() {
            displayDate.setMonth(displayDate.getMonth() - 1);
            renderCalendar();
        }

        function nextMonth() {
            displayDate.setMonth(displayDate.getMonth() + 1);
            renderCalendar();
        }

        renderCalendar();

        // 尝试获取真实位置天气（使用免费API）
        async function fetchRealWeather() {
            try {
                // 使用 ipapi 获取位置
                const locationRes = await fetch('https://ipapi.co/json/');
                const locationData = await locationRes.json();
                const city = locationData.city || '北京';

                // 使用 Open-Meteo 获取天气（免费无需API Key）
                const lat = locationData.latitude || 39.9042;
                const lon = locationData.longitude || 116.4074;

                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,surface_pressure,wind_speed_10m&timezone=auto`);
                const weatherData = await weatherRes.json();
                const current = weatherData.current;

                // 天气代码映射
                const weatherCodes = {
                    0: { desc: '晴朗', type: 'sunny' },
                    1: { desc: ' mainly clear', type: 'sunny' },
                    2: { desc: '多云', type: 'cloudy' },
                    3: { desc: '阴天', type: 'cloudy' },
                    45: { desc: '雾', type: 'cloudy' },
                    48: { desc: '雾凇', type: 'cloudy' },
                    51: { desc: '毛毛雨', type: 'rain' },
                    53: { desc: '小雨', type: 'rain' },
                    55: { desc: '中雨', type: 'rain' },
                    61: { desc: '小雨', type: 'rain' },
                    63: { desc: '中雨', type: 'rain' },
                    65: { desc: '大雨', type: 'rain' },
                    71: { desc: '小雪', type: 'cloudy' },
                    73: { desc: '中雪', type: 'cloudy' },
                    75: { desc: '大雪', type: 'cloudy' },
                };

                const code = current.weather_code;
                const weatherInfo = weatherCodes[code] || { desc: '多云', type: 'cloudy' };

                document.getElementById('city-name').textContent = city;
                document.getElementById('temperature').textContent = Math.round(current.temperature_2m);
                document.getElementById('weather-desc').textContent = `${weatherInfo.desc} · 湿度${current.relative_humidity_2m}%`;
                document.getElementById('humidity').textContent = `${current.relative_humidity_2m}%`;
                document.getElementById('wind').textContent = `风速 ${current.wind_speed_10m}km/h`;
                document.getElementById('pressure').textContent = `${Math.round(current.surface_pressure)}hPa`;
                document.getElementById('weather-icon').innerHTML = weatherIcons[weatherInfo.type];

            } catch (e) {
                console.log('使用默认天气数据');
            }
        }

        // 页面加载后尝试获取真实天气
        fetchRealWeather();
    </script>
</body>
</html>
